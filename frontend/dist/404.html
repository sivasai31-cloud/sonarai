<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SONARIS-X | Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Encodes path and query and redirects to /sonaris-x/
      var pathSegmentsToKeep = 1; // '/sonaris-x/'
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body style="background-color: #01040a; color: #38bdf8; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>REDIRECTING TO SONARIS-X PLATFORM...</p>
  </body>
</html>
